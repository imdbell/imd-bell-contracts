[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 50
no_storage_caching = true
bytecode_hash = "none"
remappings = [
  "v4-core/=lib/v4-core/",
  "forge-std/=lib/forge-std/src/",
  "solmate/=lib/v4-core/lib/solmate/",
  "@openzeppelin/=lib/v4-core/lib/openzeppelin-contracts/",
]

[lint]
lint_on_build = false

[fuzz]
runs = 64

[invariant]
runs = 8
depth = 150
fail_on_revert = true
